name: CI

on:
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      # ── 체크아웃 & Node.js ──────────────────────────────────────────────────
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # ── 타입 검사 + 빌드 (FR-016) ───────────────────────────────────────────
      - name: Build
        run: npm run build

      - name: TypeScript type check
        run: npx tsc --noEmit

      # ── 서버 키 번들 포함 여부 스캔 (FR-018) ────────────────────────────────
      - name: Security — scan for service key in client bundle
        run: |
          if grep -rl "SUPABASE_SERVICE_ROLE_KEY" .next/static/ 2>/dev/null | grep -q .; then
            echo "Security violation: SUPABASE_SERVICE_ROLE_KEY found in client bundle"
            exit 1
          fi
          echo "Security scan passed"

      # ── 단위 테스트 Vitest (FR-016) ─────────────────────────────────────────
      - name: Unit tests (Vitest)
        run: npm run test

      # ── 로컬 Supabase 시작 ───────────────────────────────────────────────────
      - uses: supabase/setup-cli@v1
        with:
          version: 3.4.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Start local Supabase
        run: npx supabase start

      - name: Apply migrations
        run: npx supabase db reset --local

      # ── 시드 데이터 주입 (U1: .env.test.local은 gitignore, 직접 추출) ────────
      - name: Inject Supabase env and seed
        run: |
          # --output json + jq -r 로 따옴표 없는 순수 값 추출
          STATUS=$(npx supabase status --output json) || {
            echo "Error: supabase status --output json failed"
            exit 1
          }
          SERVICE_KEY=$(echo "$STATUS" | jq -r '.SERVICE_ROLE_KEY')
          API_URL=$(echo "$STATUS" | jq -r '.API_URL')
          ANON_KEY=$(echo "$STATUS" | jq -r '.ANON_KEY')

          # 키 유효성 검사 (값 자체는 로그에 출력하지 않음)
          if [ -z "$SERVICE_KEY" ] || [ "$SERVICE_KEY" = "null" ]; then
            echo "Error: SERVICE_ROLE_KEY is empty or missing in supabase status output"
            exit 1
          fi
          if [[ "$SERVICE_KEY" == '"'* ]]; then
            echo "Error: SERVICE_ROLE_KEY starts with a quote — jq parsing failed"
            exit 1
          fi
          if [ -z "$API_URL" ] || [ "$API_URL" = "null" ]; then
            echo "Error: API_URL is empty or missing in supabase status output"
            exit 1
          fi

          # 이후 단계(E2E)에서 Next.js 서버가 Supabase에 접근할 수 있도록 영속 전파
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_KEY" >> $GITHUB_ENV

          SUPABASE_URL="$API_URL" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_KEY" \
          npx tsx scripts/seed.ts

      # ── E2E + axe 접근성 (FR-009, FR-016, SC-007) ───────────────────────────
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests (Playwright + axe)
        run: npm run test:e2e
        env:
          CI: "true"
